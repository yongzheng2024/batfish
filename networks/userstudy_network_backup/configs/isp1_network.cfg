
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname isp1_network
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
ip domain name lab.local
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 192.18.14.101 255.255.255.255
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 192.0.2.2 255.255.255.0
 media-type gbic
 speed 1000
 duplex full
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 198.51.100.2 255.255.255.0
 negotiation auto
!
!
!
router bgp 1400
 bgp router-id 192.18.14.101
 bgp log-neighbor-changes
 !bgp bestpath as-path multipath-relax
 neighbor as400 peer-group
 neighbor as400 remote-as 400
 neighbor 192.0.2.1 peer-group as400
 neighbor 198.51.100.1 peer-group as400
 !
 address-family ipv4
  bgp dampening
  bgp additional-paths select all
  bgp additional-paths send receive
  !neighbor as1400 next-hop-self
  neighbor as400 send-community both
  neighbor 192.0.2.1 activate
  neighbor 198.51.100.1 activate
  !maximum-paths ibgp 4
  !maximum-paths eibgp 4
 exit-address-family
!
ip forward-protocol nd
!
!
!
no ip http server
no ip http secure-server
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
